<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#130D2A"/>
      <stop offset="100%" stop-color="#050208"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0AAFF"/>
      <stop offset="40%" stop-color="#9D4EDD"/>
      <stop offset="100%" stop-color="#6E1AAB"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#9D4EDD" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)"/>
  <rect width="500" height="500" x="6" y="6" rx="114" fill="none" stroke="url(#purpleGrad)" stroke-width="8" stroke-opacity="0.7"/>

  <!-- Logo Content: Stream Reel Play / Y Logo -->
  <g filter="url(#glow)">
    <!-- Sleek Stylized Y -->
    <path d="M 130 120 L 256 276 L 382 120 L 320 120 L 256 200 L 192 120 Z" fill="url(#purpleGrad)"/>
    <path d="M 230 250 L 282 250 L 282 392 L 230 392 Z" fill="url(#purpleGrad)"/>
    
    <!-- Play Triangle -->
    <polygon points="230,225 330,285 230,345" fill="#FFFFFF"/>
  </g>
</svg>
